server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: vending-erp-backend
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3308/vend_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:vend123}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      validation-query: SELECT 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 并行票各占版本号段(M2-6=V1.0.6),低版本后到也允许补跑,避免并行开发互卡
    out-of-order: true
    locations: classpath:db/migration
  mvc:
    pathmatch:
      # springfox 3 兼容:回退 AntPathMatcher(配合 SpringFoxCompatConfig)
      matching-strategy: ant_path_matcher
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Knife4j 接口文档:http://127.0.0.1:8081/api/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# 平台门户 SSO(aole-portal · eco.vvaix.com 免登直达)。全部由 ENV 注入,真值只放 .env 不入仓
# SSO_ENABLED=false 时 SsoController 不挂载;容器内门户地址一般为 http://host.docker.internal:18151/api
sso:
  enabled: ${SSO_ENABLED:false}
  portal-base-url: ${SSO_PORTAL_BASE_URL:}
  app-id: ${SSO_APP_ID:}
  client-secret: ${SSO_CLIENT_SECRET:}
  jwt-issuer: ${SSO_PORTAL_JWT_ISSUER:aole-portal,yunshan-portal}
  frontend-callback-path: ${SSO_FRONTEND_CALLBACK_PATH:/sso/callback}

# LLM 网关(OpenAI 兼容,ENV 注入;开发期全 mock 不发真请求)
llm:
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}

logging:
  level:
    top.aole.vend: debug


# 账号体系（2026-08-19 邀请码注册 · 全系统统一契约）
vend:
  auth:
    invite-code: ${REGISTER_INVITE_CODE:dgsd1985}
    register-default-role: ${REGISTER_DEFAULT_ROLE:店员}   # 首个注册账号自动为「老板」
    secret: ${VEND_AUTH_SECRET:vend-dev-secret-change-me}     # 生产必须配 VEND_AUTH_SECRET
    token-ttl-seconds: 2592000
    placeholder-headers-enabled: ${VEND_PLACEHOLDER_HEADERS:false}

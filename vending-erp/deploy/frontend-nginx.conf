# 前端容器内 nginx:SPA history 模式 + /api 反代到后端容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由 history 模式:找不到文件回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到后端容器(compose 内部服务名 vend-server:8081)
    location /api/ {
        proxy_pass http://vend-server:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;   # 导入 Excel 上传
    }
}

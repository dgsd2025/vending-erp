# 前端容器内 nginx:SPA history 模式 + /api 反代到后端容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的静态资源:文件名变了才会变,可长缓存(部署后自动拿新文件)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 前端路由 history 模式:找不到文件回落 index.html
    # index.html 绝不缓存,否则部署后浏览器还引用旧 hash 的 JS(用户卡旧版)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到后端容器(compose 内部服务名 vend-server:8081)
    location /api/ {
        proxy_pass http://vend-server:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;   # 导入 Excel 上传
    }
}

# 售卖机 ERP 中央 Caddy 路由片段
# 放置:软链到 /data/caddy/sites.d/vend.conf,central-caddy reload 生效
# 前提:central-caddy 已 `docker network connect vend-edge central-caddy`(与 vend-web 同网)
#
# ── 备案 ──
#   aoleplat.com 已备案(zhyq.aoleplat.com 已 HTTPS 在用),子域 vend.aoleplat.com 可直接启用。
#   仅需在阿里云 DNS 加一条 A 记录:vend → 121.40.120.226(见 dns-records.md)。
#   DNS 生效后,Caddy 自动从 Let's Encrypt 签发/续期证书。
#
vend.aoleplat.com {
    encode zstd gzip
    reverse_proxy vend-web:80
    log {
        output file /var/log/caddy/vend.access.log
    }
}

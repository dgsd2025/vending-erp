# 售卖机 ERP 中央 Caddy 路由片段
# 放置:软链到 /data/caddy/sites.d/vend.conf,central-caddy reload 生效
#
# ── 备案通过前(域名被云厂商拦截,只能 IP+端口访问)──
#    直接访问 http://121.40.120.226:8085/(需在阿里云安全组放行 8085,或临时改 compose 端口映射为 0.0.0.0)
#    此阶段不需要下面的域名段。
#
# ── 备案通过后:启用域名段 ──
vend.aoleplat.com {
    encode gzip
    reverse_proxy 127.0.0.1:8085
    # Caddy 自动从 Let's Encrypt 签发证书 + 自动续期(备案后域名可正常验证)
}
